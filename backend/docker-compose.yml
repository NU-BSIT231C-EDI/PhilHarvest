version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: philharvest_app
        working_dir: /app
        volumes:
            - ./:/app
        ports:
            - "8000:8000"
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=philharvest
            - DB_USERNAME=root
            - DB_PASSWORD=root
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - QUEUE_CONNECTION=redis
        depends_on:
            - mysql
            - redis
        networks:
            - philharvest_network
        command: php artisan serve --host=0.0.0.0

    mysql:
        image: mysql:8.0
        container_name: philharvest_mysql
        environment:
            MYSQL_DATABASE: philharvest
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./:/app # Mount entire project for development
            - /app/vendor # Prevent vendor folder overwrite
            - /app/node_modules # Prevent node_modules overwrite (if applicable)
        networks:
            - philharvest_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 3

    redis:
        image: redis:7
        container_name: philharvest_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - philharvest_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

volumes:
    mysql_data:
    redis_data:

networks:
    philharvest_network:
        driver: bridge
